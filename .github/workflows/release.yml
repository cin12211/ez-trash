name: Build, Sign, and Release EzTrash

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build & Notarize macOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary_keychain_password_123"
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Decode and import p12 certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          
          # Configure keychain access partition list
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>developer-id</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_DEVELOPER_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Archive Xcode Project
        run: |
          xcodebuild -project EzTrash.xcodeproj \
                     -scheme EzTrash \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/EzTrash.xcarchive \
                     archive

      - name: Export Signed Archive
        run: |
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/EzTrash.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/Exported

      - name: Compress App for Notarization
        run: |
          cd $RUNNER_TEMP/Exported
          zip -r ../../../EzTrash.zip EzTrash.app
          cd -

      - name: Notarize App with Apple
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          # Write App Store Connect API Key to file
          mkdir -p ~/.private_keys
          echo "$KEY_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_$KEY_ID.p8
          
          # Submit to Apple Notary Service and wait for result
          xcrun notarytool submit EzTrash.zip \
                           --key-id "$KEY_ID" \
                           --issuer "$ISSUER_ID" \
                           --key ~/.private_keys/AuthKey_$KEY_ID.p8 \
                           --wait

      - name: Staple Notarization Ticket to App
        run: |
          xcrun stapler staple $RUNNER_TEMP/Exported/EzTrash.app

      - name: Re-compress Stapled App for Release
        run: |
          rm -f EzTrash.zip
          cd $RUNNER_TEMP/Exported
          zip -r ../../../EzTrash.zip EzTrash.app
          cd -

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: EzTrash.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
